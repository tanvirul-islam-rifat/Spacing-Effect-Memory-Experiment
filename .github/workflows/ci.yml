name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reproduce-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run test suite (reproduces every statistic reported in the paper)
        run: pytest -q
      - name: Run full analysis
        run: python analysis/analyze.py
